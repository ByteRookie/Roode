# ─────────────────────────────────────────────────────────────────────────────
# Roode HA Entities Package
# Include this in your main YAML with one line:
#
#   packages:
#     roode_entities: !include roode_entities.yaml
#
# Substitutions below are defaults — override them in your main YAML if needed:
#   friendly_name — prefix used for all entity names (default: "Roode")
#   roode_id      — must match the `id:` of your `roode:` block (default: roode_platform)
#
# ── Home Assistant dashboard tip ─────────────────────────────────────────────
# To see calibration status alongside the buttons, create an Entities card in
# HA with these entities grouped together:
#
#   type: entities
#   title: Roode Calibration
#   entities:
#     - button.roode_calibrate_empty_room
#     - button.roode_calibrate_with_person
#     - button.roode_calibrate_low_obstacle
#     - button.roode_calibrate_high_obstacle
#     - text_sensor.roode_calibration_status      # ← live status during cal
#     - text_sensor.roode_status                  # ← general sensor status
# ─────────────────────────────────────────────────────────────────────────────
substitutions:
  friendly_name: Roode
  roode_id: roode_platform

# ── Calibration controls ──────────────────────────────────────────────────────
# All buttons are entity_category: config so they appear together in the HA
# device page "Configuration" section alongside the Calibration Status sensor.
button:
  - platform: restart
    name: $friendly_name Restart
    entity_category: config

  - platform: template
    name: $friendly_name Calibrate Empty Room
    icon: mdi:ruler-square-compass
    entity_category: config
    on_press:
      - lambda: "id(${roode_id})->recalibration();"

  - platform: template
    name: $friendly_name Calibrate With Person
    icon: mdi:human-greeting
    entity_category: config
    on_press:
      - lambda: "id(${roode_id})->person_calibration();"

  - platform: template
    name: $friendly_name Calibrate Low Obstacle
    icon: mdi:dog
    entity_category: config
    on_press:
      - lambda: "id(${roode_id})->calibrate_low_obstacle();"

  - platform: template
    name: $friendly_name Calibrate High Obstacle
    icon: mdi:door-open
    entity_category: config
    on_press:
      - lambda: "id(${roode_id})->calibrate_high_obstacle();"

# ── Text sensors ──────────────────────────────────────────────────────────────
# sensor_status is entity_category: diagnostic so it appears in the HA device
# "Diagnostic" section — easy to spot next to the config controls above.
text_sensor:
  - platform: roode
    roode_id: ${roode_id}
    sensor_status:
      name: $friendly_name Status
      entity_category: diagnostic
      icon: mdi:information-outline
    version:
      name: $friendly_name Version
      entity_category: diagnostic
    entry_exit_event:
      name: $friendly_name Last Direction
    enabled_features:
      name: $friendly_name Features
      entity_category: diagnostic

# ── Runtime number entities (all changes saved to flash automatically) ────────
number:
  - platform: roode
    roode_id: ${roode_id}
    filter_window:
      name: $friendly_name Filter Window
    sampling:
      name: $friendly_name Sampling
    entry_max_threshold:
      name: $friendly_name Entry Max Threshold
    entry_min_threshold:
      name: $friendly_name Entry Min Threshold
    exit_max_threshold:
      name: $friendly_name Exit Max Threshold
    exit_min_threshold:
      name: $friendly_name Exit Min Threshold
    auto_calibration_interval:
      name: $friendly_name Auto Calibration Interval
    entry_roi_height:
      name: $friendly_name Entry ROI Height
    entry_roi_width:
      name: $friendly_name Entry ROI Width
    exit_roi_height:
      name: $friendly_name Exit ROI Height
    exit_roi_width:
      name: $friendly_name Exit ROI Width

# ── Runtime select entities ───────────────────────────────────────────────────
select:
  - platform: roode
    roode_id: ${roode_id}
    filter_mode:
      name: $friendly_name Filter Mode
    ranging_mode:
      name: $friendly_name Ranging Mode

# ── Runtime switch entities ───────────────────────────────────────────────────
switch:
  - platform: roode
    roode_id: ${roode_id}
    invert_direction:
      name: $friendly_name Invert Direction
    calibration_persistence:
      name: $friendly_name Save Settings to Flash

# ── Diagnostic sensors (shown in HA; disable in entity registry if not needed) ─
sensor:
  - platform: roode
    id: roode_sensors
    roode_id: ${roode_id}
    distance_entry:
      name: $friendly_name Distance Zone 0
      filters:
        - delta: 100
    distance_exit:
      name: $friendly_name Distance Zone 1
      filters:
        - delta: 100
    max_threshold_entry:
      name: $friendly_name Max Zone 0
    max_threshold_exit:
      name: $friendly_name Max Zone 1
    min_threshold_entry:
      name: $friendly_name Min Zone 0
    min_threshold_exit:
      name: $friendly_name Min Zone 1
    roi_height_entry:
      name: $friendly_name ROI Height Zone 0
    roi_width_entry:
      name: $friendly_name ROI Width Zone 0
    roi_height_exit:
      name: $friendly_name ROI Height Zone 1
    roi_width_exit:
      name: $friendly_name ROI Width Zone 1
    sensor_status:
      name: $friendly_name Sensor Status Code
      entity_category: diagnostic
    manual_adjustment_count:
      name: $friendly_name Manual Adjustments
      entity_category: diagnostic
    loop_time:
      name: $friendly_name Loop Time
      entity_category: diagnostic
    cpu_usage:
      name: $friendly_name CPU Usage
      entity_category: diagnostic
    ram_free:
      name: $friendly_name RAM Free
      entity_category: diagnostic

# ── Presence binary sensors ───────────────────────────────────────────────────
binary_sensor:
  - platform: roode
    roode_id: ${roode_id}
    presence:
      name: $friendly_name Presence
