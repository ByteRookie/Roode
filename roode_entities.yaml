# ─────────────────────────────────────────────────────────────────────────────
# Roode HA Entities Package
# Include this in your main YAML with one line:
#
#   packages:
#     roode_entities: !include roode_entities.yaml
#
# Substitutions below are defaults — override them in your main YAML if needed:
#   friendly_name — prefix used for all entity names (default: "Roode")
#   roode_id      — must match the `id:` of your `roode:` block (default: roode_platform)
#
# ── Entity layout in Home Assistant ──────────────────────────────────────────
#
# HA splits entities into four fixed sections (in this order):
#   Controls   — non-sensor entities with no entity_category
#   Sensors    — sensor/binary_sensor entities with no entity_category
#   Configuration — entity_category: config
#   Diagnostic — entity_category: diagnostic
#
#   Controls  (main — always visible)
#     • People Count (in your main YAML)
#     • Last Direction
#
#   Sensors  (live sensor data)
#     • Status  • Presence
#     • Distance Zone 0  • Distance Zone 1  (hidden when Performance Mode ON)
#
#   Configuration  (calibration + all tuning controls)
#     • Calibration Mode (select)  • Run Calibration (button)
#     • Restart                    • Performance Mode  (disabled by default)
#     • Filter Window  • Sampling       • Filter Mode    • Ranging Mode
#     • Entry / Exit Max & Min Threshold
#     • Entry / Exit ROI Height & Width
#     • Invert Direction  • Save Calibration to Flash
#     • Auto Calibration Interval
#
#   Diagnostic  (collapsed by default — raw readbacks, hidden when Performance Mode ON)
#     • Threshold sensors  • ROI sensors           (disabled by default)
#     • Sensor Status Code • Manual Adjustments     (disabled by default)
#     • Loop Time  • CPU Usage  • RAM Free  • Flash Used  (disabled by default)
#     • Version    • Features
#     • (optional) Interrupt Status • XSHUT State
#     • (optional) Entry Presence   • Exit Presence
#
# ─────────────────────────────────────────────────────────────────────────────
substitutions:
  friendly_name: Roode
  roode_id: roode_platform

# ── Controls: primary entities (no entity_category → Controls) ───────────────

text_sensor:
  - platform: roode
    roode_id: ${roode_id}
    entry_exit_event:
      name: $friendly_name Last Direction
      entity_category: ""   # Override DIAGNOSTIC Python default → Controls section

    sensor_status:
      name: $friendly_name Status
      entity_category: ""   # Sensors section

    version:
      name: $friendly_name Version       # Diagnostic (default in text_sensor.py)
    enabled_features:
      name: $friendly_name Features      # Diagnostic (default)

number:
  - platform: roode
    roode_id: ${roode_id}
    # entity_category: config → Configuration section (grouped with calibration)
    auto_calibration_interval:
      name: $friendly_name Auto Calibration Interval
      entity_category: config
    entry_max_threshold:
      name: $friendly_name Entry Max Threshold
      entity_category: config
    entry_min_threshold:
      name: $friendly_name Entry Min Threshold
      entity_category: config
    exit_max_threshold:
      name: $friendly_name Exit Max Threshold
      entity_category: config
    exit_min_threshold:
      name: $friendly_name Exit Min Threshold
      entity_category: config
    filter_window:
      name: $friendly_name Filter Window
      entity_category: config
    sampling:
      name: $friendly_name Sampling
      entity_category: config
    entry_roi_height:
      name: $friendly_name Entry ROI Height
      entity_category: config
    entry_roi_width:
      name: $friendly_name Entry ROI Width
      entity_category: config
    exit_roi_height:
      name: $friendly_name Exit ROI Height
      entity_category: config
    exit_roi_width:
      name: $friendly_name Exit ROI Width
      entity_category: config

select:
  - platform: roode
    roode_id: ${roode_id}
    filter_mode:
      name: $friendly_name Filter Mode
      entity_category: config
    ranging_mode:
      name: $friendly_name Ranging Mode
      entity_category: config

  - platform: template
    name: $friendly_name Calibration Mode
    id: calibration_mode_select
    entity_category: config
    icon: mdi:tune
    options:
      - "Empty Room"
      - "With Person"
      - "Low Obstacle"
      - "High Obstacle"
    initial_option: "Empty Room"
    optimistic: true
    set_action:
      - lambda: ""

switch:
  - platform: roode
    roode_id: ${roode_id}
    invert_direction:
      name: $friendly_name Invert Direction
      entity_category: config
    calibration_persistence:
      name: $friendly_name Save Calibration to Flash
      entity_category: config
    performance_mode:
      name: $friendly_name Performance Mode
      entity_category: config
      disabled_by_default: true

# ── Sensors: passive readouts (no entity_category → Sensors) ─────────────────

binary_sensor:
  - platform: roode
    roode_id: ${roode_id}
    presence:
      name: $friendly_name Presence
      device_class: occupancy

    # Optional: uncomment to expose XSHUT pin state (diagnostic)
    # sensor_xshut_state:
    #   name: $friendly_name XSHUT State
    #   entity_category: diagnostic

    # Optional: uncomment to expose per-zone presence sensors
    # zones:
    #   entry:
    #     presence:
    #       name: $friendly_name Entry Zone Presence
    #       device_class: occupancy
    #   exit:
    #     presence:
    #       name: $friendly_name Exit Zone Presence
    #       device_class: occupancy

# ── Configuration: calibration controls + all tuning knobs ──────────────────

button:
  - platform: template
    name: $friendly_name Run Calibration
    icon: mdi:play-circle
    entity_category: config
    on_press:
      - lambda: |-
          auto sel = id(calibration_mode_select).state;
          if (sel == "Empty Room")         id(${roode_id})->recalibration();
          else if (sel == "With Person")   id(${roode_id})->person_calibration();
          else if (sel == "Low Obstacle")  id(${roode_id})->calibrate_low_obstacle();
          else if (sel == "High Obstacle") id(${roode_id})->calibrate_high_obstacle();

  - platform: restart
    name: $friendly_name Restart
    entity_category: config

# ── Diagnostic: raw sensor data for setup and troubleshooting ────────────────
# All sensor entities default to entity_category: diagnostic (set in sensor.py).
# Sensors marked with (*) are suppressed (show "unavailable") when Performance
# Mode is ON — they are only useful during setup/troubleshooting.

sensor:
  - platform: roode
    roode_id: ${roode_id}
    distance_entry:
      name: $friendly_name Distance Zone 0  # (*) suppressed in Performance Mode
      entity_category: ""                   # Sensors section (override diagnostic default)
      filters:
        - delta: 100
    distance_exit:
      name: $friendly_name Distance Zone 1  # (*) suppressed in Performance Mode
      entity_category: ""                   # Sensors section (override diagnostic default)
      filters:
        - delta: 100
    max_threshold_entry:
      name: $friendly_name Max Zone 0
      disabled_by_default: true
    max_threshold_exit:
      name: $friendly_name Max Zone 1
      disabled_by_default: true
    min_threshold_entry:
      name: $friendly_name Min Zone 0
      disabled_by_default: true
    min_threshold_exit:
      name: $friendly_name Min Zone 1
      disabled_by_default: true
    roi_height_entry:
      name: $friendly_name ROI Height Zone 0
      disabled_by_default: true
    roi_width_entry:
      name: $friendly_name ROI Width Zone 0
      disabled_by_default: true
    roi_height_exit:
      name: $friendly_name ROI Height Zone 1
      disabled_by_default: true
    roi_width_exit:
      name: $friendly_name ROI Width Zone 1
      disabled_by_default: true
    sensor_status:
      name: $friendly_name Sensor Status Code
      disabled_by_default: true
    manual_adjustment_count:
      name: $friendly_name Manual Adjustments
      disabled_by_default: true
    loop_time:
      name: $friendly_name Loop Time         # (*) suppressed in Performance Mode
      disabled_by_default: true
    cpu_usage:
      name: $friendly_name CPU Usage         # (*) suppressed in Performance Mode
      disabled_by_default: true
    ram_free:
      name: $friendly_name RAM Free          # (*) suppressed in Performance Mode
      disabled_by_default: true
    flash_free:
      name: $friendly_name Flash Used        # (*) suppressed in Performance Mode
      disabled_by_default: true

    # Optional: uncomment to expose interrupt status (diagnostic, advanced)
    # interrupt_status:
    #   name: $friendly_name Interrupt Status
