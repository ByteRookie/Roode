# ─────────────────────────────────────────────────────────────────────────────
# Roode HA Entities Package
# Include this in your main YAML with one line:
#
#   packages:
#     roode_entities: !include roode_entities.yaml
#
# Substitutions below are defaults — override them in your main YAML if needed:
#   friendly_name — prefix used for all entity names (default: "Roode")
#   roode_id      — must match the `id:` of your `roode:` block (default: roode_platform)
#
# ── Entity layout in Home Assistant ──────────────────────────────────────────
#
# NOTE: HA's device page has three fixed section labels:
#   Main | Configuration | Diagnostic
# You cannot add custom section names (e.g. "Calibration") in HA.
# Within the Configuration section, HA sorts entities alphabetically.
# Entity names below are prefixed so calibration items sort before controls:
#   "Cal …"  → calibration items (appear first alphabetically)
#   "Ctrl …" → configuration/control items (appear after)
#
#   Main  (device card, always visible)
#     • Distance Zone 0 / 1   • Last Direction   • Presence
#     (People Count and Occupancy live in your main YAML)
#
#   Configuration  (HA label — two logical groups sorted alphabetically)
#     ── Calibration ──
#     • Cal Status             • Cal Empty Room    • Cal With Person
#     • Cal Low Obstacle       • Cal High Obstacle
#     • Cal Auto Interval      • Cal Save to Flash
#     • Cal Entry Max / Min    • Cal Exit Max / Min
#     ── Controls / Configuration ──
#     • Ctrl Filter Mode       • Ctrl Filter Window  • Ctrl Invert Direction
#     • Ctrl Performance Mode  • Ctrl Ranging Mode   • Ctrl Restart
#     • Ctrl ROI Entry H/W     • Ctrl ROI Exit H/W   • Ctrl Sampling
#
#   Diagnostic  (collapsed by default)
#     • CPU Usage  • Loop Time  • Manual Adjustments  • RAM Free
#     • ROI / Threshold sensors • Sensor Status Code  • Version  • Features
#
# ─────────────────────────────────────────────────────────────────────────────
substitutions:
  friendly_name: Roode
  roode_id: roode_platform

# ── Main: day-to-day operational entities ────────────────────────────────────

text_sensor:
  - platform: roode
    roode_id: ${roode_id}
    entry_exit_event:
      name: $friendly_name Last Direction
      entity_category: ""          # Main section

    # Prefixed "Cal" so it sorts into the calibration group in HA Configuration.
    sensor_status:
      name: $friendly_name Cal Status
      entity_category: config

    version:
      name: $friendly_name Version  # Diagnostic (default)
    enabled_features:
      name: $friendly_name Features  # Diagnostic (default)

binary_sensor:
  - platform: roode
    roode_id: ${roode_id}
    presence:
      name: $friendly_name Presence  # Main section (no entity_category)

# ── Configuration — Calibration ──────────────────────────────────────────────
# Entity names prefixed with "Cal" so HA sorts them before "Ctrl" items.

button:
  - platform: template
    name: $friendly_name Cal Empty Room
    icon: mdi:ruler-square-compass
    entity_category: config
    on_press:
      - lambda: "id(${roode_id})->recalibration();"

  - platform: template
    name: $friendly_name Cal With Person
    icon: mdi:human-greeting
    entity_category: config
    on_press:
      - lambda: "id(${roode_id})->person_calibration();"

  - platform: template
    name: $friendly_name Cal Low Obstacle
    icon: mdi:dog
    entity_category: config
    on_press:
      - lambda: "id(${roode_id})->calibrate_low_obstacle();"

  - platform: template
    name: $friendly_name Cal High Obstacle
    icon: mdi:door-open
    entity_category: config
    on_press:
      - lambda: "id(${roode_id})->calibrate_high_obstacle();"

  - platform: restart
    name: $friendly_name Ctrl Restart
    entity_category: config

number:
  - platform: roode
    roode_id: ${roode_id}
    # ── Calibration numbers (Cal prefix) ──────────────────────────────────────
    auto_calibration_interval:
      name: $friendly_name Cal Auto Interval
      entity_category: config
    entry_max_threshold:
      name: $friendly_name Cal Entry Max
      entity_category: config
    entry_min_threshold:
      name: $friendly_name Cal Entry Min
      entity_category: config
    exit_max_threshold:
      name: $friendly_name Cal Exit Max
      entity_category: config
    exit_min_threshold:
      name: $friendly_name Cal Exit Min
      entity_category: config
    # ── Configuration/control numbers (Ctrl prefix) ───────────────────────────
    filter_window:
      name: $friendly_name Ctrl Filter Window
      entity_category: config
    sampling:
      name: $friendly_name Ctrl Sampling
      entity_category: config
    entry_roi_height:
      name: $friendly_name Ctrl ROI Entry Height
      entity_category: config
    entry_roi_width:
      name: $friendly_name Ctrl ROI Entry Width
      entity_category: config
    exit_roi_height:
      name: $friendly_name Ctrl ROI Exit Height
      entity_category: config
    exit_roi_width:
      name: $friendly_name Ctrl ROI Exit Width
      entity_category: config

select:
  - platform: roode
    roode_id: ${roode_id}
    filter_mode:
      name: $friendly_name Ctrl Filter Mode
      entity_category: config
    ranging_mode:
      name: $friendly_name Ctrl Ranging Mode
      entity_category: config

switch:
  - platform: roode
    roode_id: ${roode_id}
    calibration_persistence:
      name: $friendly_name Cal Save to Flash
      entity_category: config
    invert_direction:
      name: $friendly_name Ctrl Invert Direction
      entity_category: config
    performance_mode:
      name: $friendly_name Ctrl Performance Mode
      entity_category: config

# ── Diagnostic: sensors shown when troubleshooting or setting up ──────────────
# Distance Zone sensors are Main (entity_category: ""). All others are Diagnostic
# (default set in sensor.py). Disable in HA entity registry if not needed.

sensor:
  - platform: roode
    id: roode_sensors
    roode_id: ${roode_id}
    distance_entry:
      name: $friendly_name Distance Zone 0
      entity_category: ""          # Main section
      filters:
        - delta: 100
    distance_exit:
      name: $friendly_name Distance Zone 1
      entity_category: ""          # Main section
      filters:
        - delta: 100
    max_threshold_entry:
      name: $friendly_name Max Zone 0
    max_threshold_exit:
      name: $friendly_name Max Zone 1
    min_threshold_entry:
      name: $friendly_name Min Zone 0
    min_threshold_exit:
      name: $friendly_name Min Zone 1
    roi_height_entry:
      name: $friendly_name ROI Height Zone 0
    roi_width_entry:
      name: $friendly_name ROI Width Zone 0
    roi_height_exit:
      name: $friendly_name ROI Height Zone 1
    roi_width_exit:
      name: $friendly_name ROI Width Zone 1
    sensor_status:
      name: $friendly_name Sensor Status Code
    manual_adjustment_count:
      name: $friendly_name Manual Adjustments
    loop_time:
      name: $friendly_name Loop Time
    cpu_usage:
      name: $friendly_name CPU Usage
    ram_free:
      name: $friendly_name RAM Free
