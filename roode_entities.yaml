# ─────────────────────────────────────────────────────────────────────────────
# Roode HA Entities Package
# Include this in your main YAML with one line:
#
#   packages:
#     roode_entities: !include roode_entities.yaml
#
# Substitutions below are defaults — override them in your main YAML if needed:
#   friendly_name — prefix used for all entity names (default: "Roode")
#   roode_id      — must match the `id:` of your `roode:` block (default: roode_platform)
#
# ── Entity layout in Home Assistant ──────────────────────────────────────────
#
# HA splits entities into four fixed sections (in this order):
#   Controls   — non-sensor entities with no entity_category
#   Sensors    — sensor/binary_sensor entities with no entity_category
#   Configuration — entity_category: config
#   Diagnostic — entity_category: diagnostic
#
#   Controls  (main — always visible)
#     • People Count (in your main YAML)
#     • Last Direction
#
#   Sensors  (live sensor data)
#     • Distance Zone 0  • Distance Zone 1  • Presence
#
#   Configuration  (calibration + all tuning controls)
#     • Status
#     • Calibrate Empty Room   • Calibrate With Person
#     • Calibrate Low Obstacle • Calibrate High Obstacle
#     • Restart                • Performance Mode
#     • Filter Window  • Sampling       • Filter Mode    • Ranging Mode
#     • Entry / Exit Max & Min Threshold
#     • Entry / Exit ROI Height & Width
#     • Invert Direction  • Save Calibration to Flash
#     • Auto Calibration Interval
#
#   Diagnostic  (collapsed by default — raw readbacks)
#     • Threshold sensors  • ROI sensors
#     • Sensor Status Code • Manual Adjustments
#     • Loop Time  • CPU Usage  • RAM Free
#     • Version    • Features
#
# ─────────────────────────────────────────────────────────────────────────────
substitutions:
  friendly_name: Roode
  roode_id: roode_platform

# ── Controls: primary entities (no entity_category → Controls) ───────────────

text_sensor:
  - platform: roode
    roode_id: ${roode_id}
    entry_exit_event:
      name: $friendly_name Last Direction
      entity_category: ""   # Override DIAGNOSTIC Python default → Controls section

    # Status goes to Configuration so it's visible next to calibration buttons.
    sensor_status:
      name: $friendly_name Status
      entity_category: config

    version:
      name: $friendly_name Version       # Diagnostic (default in text_sensor.py)
    enabled_features:
      name: $friendly_name Features      # Diagnostic (default)

number:
  - platform: roode
    roode_id: ${roode_id}
    # entity_category: config → Configuration section (grouped with calibration)
    auto_calibration_interval:
      name: $friendly_name Auto Calibration Interval
      entity_category: config
    entry_max_threshold:
      name: $friendly_name Entry Max Threshold
      entity_category: config
    entry_min_threshold:
      name: $friendly_name Entry Min Threshold
      entity_category: config
    exit_max_threshold:
      name: $friendly_name Exit Max Threshold
      entity_category: config
    exit_min_threshold:
      name: $friendly_name Exit Min Threshold
      entity_category: config
    filter_window:
      name: $friendly_name Filter Window
      entity_category: config
    sampling:
      name: $friendly_name Sampling
      entity_category: config
    entry_roi_height:
      name: $friendly_name Entry ROI Height
      entity_category: config
    entry_roi_width:
      name: $friendly_name Entry ROI Width
      entity_category: config
    exit_roi_height:
      name: $friendly_name Exit ROI Height
      entity_category: config
    exit_roi_width:
      name: $friendly_name Exit ROI Width
      entity_category: config

select:
  - platform: roode
    roode_id: ${roode_id}
    # entity_category: config → Configuration section
    filter_mode:
      name: $friendly_name Filter Mode
      entity_category: config
    ranging_mode:
      name: $friendly_name Ranging Mode
      entity_category: config

switch:
  - platform: roode
    roode_id: ${roode_id}
    # entity_category: config → Configuration section (grouped with calibration)
    invert_direction:
      name: $friendly_name Invert Direction
      entity_category: config
    calibration_persistence:
      name: $friendly_name Save Calibration to Flash
      entity_category: config
    performance_mode:
      name: $friendly_name Performance Mode
      entity_category: config

# ── Sensors: passive readouts (no entity_category → Sensors) ─────────────────

binary_sensor:
  - platform: roode
    roode_id: ${roode_id}
    presence:
      name: $friendly_name Presence

# ── Configuration: calibration controls + all tuning knobs ──────────────────

button:
  - platform: template
    name: $friendly_name Calibrate Empty Room
    icon: mdi:ruler-square-compass
    entity_category: config
    on_press:
      - lambda: "id(${roode_id})->recalibration();"

  - platform: template
    name: $friendly_name Calibrate With Person
    icon: mdi:human-greeting
    entity_category: config
    on_press:
      - lambda: "id(${roode_id})->person_calibration();"

  - platform: template
    name: $friendly_name Calibrate Low Obstacle
    icon: mdi:dog
    entity_category: config
    on_press:
      - lambda: "id(${roode_id})->calibrate_low_obstacle();"

  - platform: template
    name: $friendly_name Calibrate High Obstacle
    icon: mdi:door-open
    entity_category: config
    on_press:
      - lambda: "id(${roode_id})->calibrate_high_obstacle();"

  - platform: restart
    name: $friendly_name Restart
    entity_category: config

# ── Diagnostic: raw sensor data for setup and troubleshooting ────────────────
# All sensor entities default to entity_category: diagnostic (set in sensor.py).

sensor:
  - platform: roode
    id: roode_sensors
    roode_id: ${roode_id}
    distance_entry:
      name: $friendly_name Distance Zone 0
      entity_category: ""          # Sensors section (override diagnostic default)
      filters:
        - delta: 100
    distance_exit:
      name: $friendly_name Distance Zone 1
      entity_category: ""          # Sensors section (override diagnostic default)
      filters:
        - delta: 100
    max_threshold_entry:
      name: $friendly_name Max Zone 0
    max_threshold_exit:
      name: $friendly_name Max Zone 1
    min_threshold_entry:
      name: $friendly_name Min Zone 0
    min_threshold_exit:
      name: $friendly_name Min Zone 1
    roi_height_entry:
      name: $friendly_name ROI Height Zone 0
    roi_width_entry:
      name: $friendly_name ROI Width Zone 0
    roi_height_exit:
      name: $friendly_name ROI Height Zone 1
    roi_width_exit:
      name: $friendly_name ROI Width Zone 1
    sensor_status:
      name: $friendly_name Sensor Status Code
    manual_adjustment_count:
      name: $friendly_name Manual Adjustments
    loop_time:
      name: $friendly_name Loop Time
    cpu_usage:
      name: $friendly_name CPU Usage
    ram_free:
      name: $friendly_name RAM Free
