substitutions:
  devicename: roode32
  friendly_name: $devicename

# ── One line gives you every HA entity: buttons, numbers, selects, switches ──
packages:
  roode_entities:
    url: https://github.com/Lyr3x/Roode
    ref: master
    files: [roode_entities.yaml]

external_components:
  refresh: always
  source:
    type: git
    url: https://github.com/Lyr3x/Roode
    ref: master

esphome:
  name: $devicename

esp32:
  board: wemos_d1_mini32
  framework:
    type: arduino

wifi:
  networks:
    - ssid: !secret ssid1
      password: !secret ssid1_password
  use_address: $devicename
  fast_connect: true
  power_save_mode: light
  domain: .local

captive_portal:

api:
  password: !secret api_password
  reboot_timeout: 60min

ota:
  password: !secret ota_password

web_server:
  port: 80
  auth:
    username: admin
    password: !secret web_password

logger:
  level: INFO

i2c:
  sda: 21
  scl: 22

vl53l1x:
  sensor_id: 1
  calibration:
    ranging: auto
  pins:
    xshut:
      number: GPIO3
      mode: OUTPUT_PULLUP
      ignore_strapping_warning: true
    interrupt:
      number: GPIO1
      mode: INPUT_PULLUP

roode:
  id: roode_platform
  sampling: 2
  zones:
    invert: true

# ── People counter number (keeps its value across reboots) ───────────────────
number:
  - platform: roode
    people_counter:
      name: $friendly_name People Counter

# ── Uptime sensor ─────────────────────────────────────────────────────────────
sensor:
  - platform: wifi_signal
    name: $friendly_name RSSI
    update_interval: 60s
  - platform: uptime
    id: uptime_sensor
    update_interval: 60s
    internal: true
    on_raw_value:
      then:
        - text_sensor.template.publish:
            id: uptime_human
            state: !lambda |-
              int seconds = round(id(uptime_sensor).raw_state);
              int days = seconds / (24 * 3600);
              seconds = seconds % (24 * 3600);
              int hours = seconds / 3600;
              seconds = seconds % 3600;
              int minutes = seconds / 60;
              seconds = seconds % 60;
              return (
                (days ? String(days) + "d " : "") +
                (hours ? String(hours) + "h " : "") +
                (minutes ? String(minutes) + "m " : "") +
                (String(seconds) + "s")
              ).c_str();

text_sensor:
  - platform: template
    name: $friendly_name Uptime
    id: uptime_human
    icon: mdi:clock-start

binary_sensor:
  - platform: status
    name: $friendly_name API Status
