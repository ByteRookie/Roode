# ─────────────────────────────────────────────────────────────────────────────
# Roode HA Entities Package
# Include this in your main YAML with one line:
#
#   packages:
#     roode_entities: !include roode_entities.yaml
#
# Substitutions below are defaults — override them in your main YAML if needed:
#   friendly_name — prefix used for all entity names (default: "Roode")
#   roode_id      — must match the `id:` of your `roode:` block (default: roode_platform)
#
# ── Entity layout in Home Assistant ──────────────────────────────────────────
#
#   Main (device card)
#     • Last Direction    • Presence
#     • Distance Zone 0   • Distance Zone 1
#     (People Count and Occupancy live in your main YAML)
#
#   Configuration → Calibration
#     • Status            • Calibrate Empty Room   • Calibrate With Person
#     • Calibrate Low Obstacle                     • Calibrate High Obstacle
#     • Auto Calibration Interval                  • Save Calibration to Flash
#     • Entry / Exit Min & Max Threshold
#
#   Configuration → Sensor Tuning
#     • Filter Window     • Sampling       • Filter Mode     • Ranging Mode
#     • Entry / Exit ROI Height & Width    • Invert Direction
#
#   Configuration → Device
#     • Restart           • Performance Mode
#
#   Diagnostic (collapsed by default — for setup and troubleshooting)
#     • Distance Zone 0/1  • Threshold sensors  • ROI sensors
#     • Sensor Status Code • Manual Adjustments • Loop Time
#     • CPU Usage          • RAM Free            • Version  • Features
#
# ─────────────────────────────────────────────────────────────────────────────
substitutions:
  friendly_name: Roode
  roode_id: roode_platform

# ── Main: day-to-day operational entities ────────────────────────────────────

text_sensor:
  - platform: roode
    roode_id: ${roode_id}
    entry_exit_event:
      name: $friendly_name Last Direction
      entity_category: ""        # Main section — visible on device card

    # Status appears in the Calibration config group so you can see the result
    # right next to the calibration buttons without leaving the section.
    sensor_status:
      name: $friendly_name Status
      entity_category: config

    # Diagnostic text sensors (shown in Diagnostic section by default)
    version:
      name: $friendly_name Version
    enabled_features:
      name: $friendly_name Features

binary_sensor:
  - platform: roode
    roode_id: ${roode_id}
    presence:
      name: $friendly_name Presence
      # No entity_category → Main section

# ── Configuration: Calibration ───────────────────────────────────────────────

button:
  # — Calibration buttons —
  - platform: template
    name: $friendly_name Calibrate Empty Room
    icon: mdi:ruler-square-compass
    entity_category: config
    on_press:
      - lambda: "id(${roode_id})->recalibration();"

  - platform: template
    name: $friendly_name Calibrate With Person
    icon: mdi:human-greeting
    entity_category: config
    on_press:
      - lambda: "id(${roode_id})->person_calibration();"

  - platform: template
    name: $friendly_name Calibrate Low Obstacle
    icon: mdi:dog
    entity_category: config
    on_press:
      - lambda: "id(${roode_id})->calibrate_low_obstacle();"

  - platform: template
    name: $friendly_name Calibrate High Obstacle
    icon: mdi:door-open
    entity_category: config
    on_press:
      - lambda: "id(${roode_id})->calibrate_high_obstacle();"

  # — Device controls —
  - platform: restart
    name: $friendly_name Restart
    entity_category: config

# ── Configuration: Sensor Tuning & Calibration Settings ──────────────────────

number:
  - platform: roode
    roode_id: ${roode_id}
    # Calibration group
    auto_calibration_interval:
      name: $friendly_name Auto Calibration Interval
      entity_category: config
    entry_max_threshold:
      name: $friendly_name Entry Max Threshold
      entity_category: config
    entry_min_threshold:
      name: $friendly_name Entry Min Threshold
      entity_category: config
    exit_max_threshold:
      name: $friendly_name Exit Max Threshold
      entity_category: config
    exit_min_threshold:
      name: $friendly_name Exit Min Threshold
      entity_category: config
    # Sensor tuning group
    filter_window:
      name: $friendly_name Filter Window
      entity_category: config
    sampling:
      name: $friendly_name Sampling
      entity_category: config
    entry_roi_height:
      name: $friendly_name Entry ROI Height
      entity_category: config
    entry_roi_width:
      name: $friendly_name Entry ROI Width
      entity_category: config
    exit_roi_height:
      name: $friendly_name Exit ROI Height
      entity_category: config
    exit_roi_width:
      name: $friendly_name Exit ROI Width
      entity_category: config

select:
  - platform: roode
    roode_id: ${roode_id}
    filter_mode:
      name: $friendly_name Filter Mode
      entity_category: config
    ranging_mode:
      name: $friendly_name Ranging Mode
      entity_category: config

switch:
  - platform: roode
    roode_id: ${roode_id}
    # Calibration group
    calibration_persistence:
      name: $friendly_name Save Calibration to Flash
      entity_category: config
    # Sensor tuning group
    invert_direction:
      name: $friendly_name Invert Direction
      entity_category: config
    # Device group — suppresses diagnostic publishing to reduce overhead
    performance_mode:
      name: $friendly_name Performance Mode
      entity_category: config

# ── Diagnostic: sensors shown when troubleshooting or setting up ──────────────
# All sensor entities below default to entity_category: diagnostic (set in
# sensor.py). Disable individual entities in HA's entity registry if not needed.

sensor:
  - platform: roode
    id: roode_sensors
    roode_id: ${roode_id}
    distance_entry:
      name: $friendly_name Distance Zone 0
      entity_category: ""          # Main section — useful for daily monitoring
      filters:
        - delta: 100
    distance_exit:
      name: $friendly_name Distance Zone 1
      entity_category: ""          # Main section — useful for daily monitoring
      filters:
        - delta: 100
    max_threshold_entry:
      name: $friendly_name Max Zone 0
    max_threshold_exit:
      name: $friendly_name Max Zone 1
    min_threshold_entry:
      name: $friendly_name Min Zone 0
    min_threshold_exit:
      name: $friendly_name Min Zone 1
    roi_height_entry:
      name: $friendly_name ROI Height Zone 0
    roi_width_entry:
      name: $friendly_name ROI Width Zone 0
    roi_height_exit:
      name: $friendly_name ROI Height Zone 1
    roi_width_exit:
      name: $friendly_name ROI Width Zone 1
    sensor_status:
      name: $friendly_name Sensor Status Code
    manual_adjustment_count:
      name: $friendly_name Manual Adjustments
    loop_time:
      name: $friendly_name Loop Time
    cpu_usage:
      name: $friendly_name CPU Usage
    ram_free:
      name: $friendly_name RAM Free
