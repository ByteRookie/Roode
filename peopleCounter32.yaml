substitutions:
  devicename: roode32
  friendly_name: $devicename

external_components:
  refresh: always
  source:
    type: git
    url: https://github.com/Lyr3x/Roode
    ref: master

esphome:
  name: $devicename

esp32:
  board: wemos_d1_mini32
  framework:
    type: arduino

wifi:
  networks:
    - ssid: !secret ssid1
      password: !secret ssid1_password
  use_address: $devicename
  fast_connect: true
  power_save_mode: light
  domain: .local

captive_portal:

api:
  password: !secret api_password
  reboot_timeout: 60min

ota:
  password: !secret ota_password

web_server:
  port: 80
  auth:
    username: admin
    password: !secret web_password

logger:
  level: INFO

i2c:
  sda: 21
  scl: 22

vl53l1x:
  sensor_id: 1
  calibration:
    ranging: auto
  pins:
    xshut:
      number: GPIO3
      mode: OUTPUT_PULLUP
      ignore_strapping_warning: true
    interrupt:
      number: GPIO1
      mode: INPUT_PULLUP

roode:
  id: roode_platform
  # All settings below are optional — defaults work for most installations.
  # Everything can be tuned from Home Assistant after first flash.
  # Uncomment and set here only if you need compile-time overrides.
  sampling: 2
  # filter_mode: percentile10
  # filter_window: 2
  # detection_thresholds:
  #   max: 85%
  # calibration_persistence: true   # default is true
  zones:
    invert: true

# --- Calibration buttons ---
button:
  - platform: restart
    name: $friendly_name Restart
    entity_category: config
  - platform: template
    name: $friendly_name Calibrate Empty Room
    icon: mdi:ruler-square-compass
    entity_category: config
    on_press:
      - lambda: id(roode_platform)->recalibration();
  - platform: template
    name: $friendly_name Calibrate With Person
    icon: mdi:human-greeting
    entity_category: config
    on_press:
      - lambda: id(roode_platform)->person_calibration();

# --- Runtime number entities (all saved to flash automatically) ---
number:
  - platform: roode
    people_counter:
      name: $friendly_name people counter
    filter_window:
      name: $friendly_name filter window
    sampling:
      name: $friendly_name sampling
    entry_max_threshold:
      name: $friendly_name entry max threshold %
    entry_min_threshold:
      name: $friendly_name entry min threshold %
    exit_max_threshold:
      name: $friendly_name exit max threshold %
    exit_min_threshold:
      name: $friendly_name exit min threshold %
    auto_calibration_interval:
      name: $friendly_name auto calibration interval
    entry_roi_height:
      name: $friendly_name entry ROI height
    entry_roi_width:
      name: $friendly_name entry ROI width
    exit_roi_height:
      name: $friendly_name exit ROI height
    exit_roi_width:
      name: $friendly_name exit ROI width

# --- Runtime select entities ---
select:
  - platform: roode
    filter_mode:
      name: $friendly_name filter mode
    ranging_mode:
      name: $friendly_name ranging mode

# --- Runtime switch entities ---
switch:
  - platform: roode
    invert_direction:
      name: $friendly_name invert direction
    calibration_persistence:
      name: $friendly_name save calibration to flash

# --- Binary sensors ---
binary_sensor:
  - platform: status
    name: $friendly_name API Status
  - platform: roode
    presence_sensor:
      name: $friendly_name presence
    sensor_xshut_state:
      name: $friendly_name xshut state

# --- Diagnostic sensors (disable in HA by default; re-enable for troubleshooting) ---
sensor:
  - platform: roode
    id: roode_sensors
    distance_entry:
      name: $friendly_name distance zone 0
      filters:
        - delta: 100
    distance_exit:
      name: $friendly_name distance zone 1
      filters:
        - delta: 100
    max_threshold_entry:
      name: $friendly_name max zone 0
    max_threshold_exit:
      name: $friendly_name max zone 1
    min_threshold_entry:
      name: $friendly_name min zone 0
    min_threshold_exit:
      name: $friendly_name min zone 1
    roi_height_entry:
      name: $friendly_name ROI height zone 0
    roi_width_entry:
      name: $friendly_name ROI width zone 0
    roi_height_exit:
      name: $friendly_name ROI height zone 1
    roi_width_exit:
      name: $friendly_name ROI width zone 1
    sensor_status:
      name: $friendly_name sensor status
    loop_time:
      name: $friendly_name loop time
    cpu_usage:
      name: $friendly_name cpu usage
    ram_usage:
      name: $friendly_name ram usage
    interrupt_status:
      name: $friendly_name interrupt status
    manual_adjustment_count:
      name: $friendly_name manual adjusts
  - platform: wifi_signal
    name: $friendly_name RSSI
    update_interval: 60s
  - platform: uptime
    name: Uptime Sensor
    id: uptime_sensor
    update_interval: 60s
    internal: true
    on_raw_value:
      then:
        - text_sensor.template.publish:
            id: uptime_human
            state: !lambda |-
              int seconds = round(id(uptime_sensor).raw_state);
              int days = seconds / (24 * 3600);
              seconds = seconds % (24 * 3600);
              int hours = seconds / 3600;
              seconds = seconds % 3600;
              int minutes = seconds /  60;
              seconds = seconds % 60;
              return (
                (days ? String(days) + "d " : "") +
                (hours ? String(hours) + "h " : "") +
                (minutes ? String(minutes) + "m " : "") +
                (String(seconds) + "s")
              ).c_str();

text_sensor:
  - platform: roode
    version:
      name: $friendly_name version
    entry_exit_event:
      name: $friendly_name last direction
    sensor_status:
      name: $friendly_name status
    enabled_features:
      name: $friendly_name enabled features
  - platform: template
    name: $friendly_name Uptime Human Readable
    id: uptime_human
    icon: mdi:clock-start
