<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Roode Config Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
  <style>
    body { font-family: system-ui, sans-serif; margin:0; background:#f6f6f6; }
    header { background:#333; color:#fff; text-align:center; padding:2rem 1rem; overflow:hidden; }
    header h1 { margin:0; font-size:2.5rem; animation: slide 1s ease-out forwards; transform:translateY(-100%); }
    @keyframes slide { to { transform:translateY(0); } }
    main { padding:1rem; max-width:800px; margin:auto; }
    label { display:block; margin-top:1rem; }
    input, select { padding:.25rem; font-size:1rem; min-width:250px; }
    pre { background:#eee; padding:.5rem; white-space:pre-wrap; }
    .copy-btn { border:none; background:none; cursor:pointer; font-size:1rem; }
    .button-group button { margin-right:.5rem; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
</head>
<body>
  <header>
    <h1>Roode</h1>
  </header>
  <main>
    <section id="install">
      <h2>Install</h2>
      <p>Install <a href="https://esphome.io/">ESPHome</a> and add Roode as an external component:</p>
      <pre>external_components:
  - source: github://Lyr3x/Roode
    refresh: always</pre>
    </section>

    <section id="config">
      <h2>Configuration Helper</h2>
      <p>Fill in the required information, choose sensors and optional features, then copy the YAML.</p>

      <label>Device Name <input id="device" placeholder="roode32"></label>
      <label>WiFi SSID <input id="ssid"></label>
      <label>WiFi Password <input id="wpass" type="password"></label>
      <label>API Password <input id="apass" type="password"></label>
      <label>OTA Password <input id="otapass" type="password"></label>

      <label>Sensors
        <select id="sensors" multiple></select>
        <div class="button-group">
          <button id="selectSensors">Select All</button>
          <button id="clearSensors">Remove All</button>
        </div>
      </label>

      <label>Features
        <select id="features" multiple></select>
        <div class="button-group">
          <button id="selectFeatures">Select All</button>
          <button id="clearFeatures">Remove All</button>
        </div>
      </label>

      <h3>Generated Config <button class="copy-btn" id="copyConfig" title="Copy to clipboard">📋</button></h3>
      <pre id="configOutput"></pre>
    </section>
  </main>

<script>
const sensors = [
  { value: 'people_counter', label: 'People Count' },
  { value: 'presence_sensor', label: 'Presence' },
  { value: 'sensor_xshut_state', label: 'XSHUT State' },
  { value: 'distance_entry', label: 'Distance Zone 0' },
  { value: 'distance_exit', label: 'Distance Zone 1' },
  { value: 'max_threshold_entry', label: 'Max Zone 0' },
  { value: 'max_threshold_exit', label: 'Max Zone 1' },
  { value: 'min_threshold_entry', label: 'Min Zone 0' },
  { value: 'min_threshold_exit', label: 'Min Zone 1' },
  { value: 'roi_height_entry', label: 'ROI Height Zone 0' },
  { value: 'roi_width_entry', label: 'ROI Width Zone 0' },
  { value: 'roi_height_exit', label: 'ROI Height Zone 1' },
  { value: 'roi_width_exit', label: 'ROI Width Zone 1' },
  { value: 'loop_time', label: 'Loop Time' },
  { value: 'cpu_usage', label: 'CPU Usage' },
  { value: 'ram_free', label: 'RAM Usage' },
  { value: 'flash_free', label: 'Flash Usage' },
  { value: 'sensor_status', label: 'Sensor Status' },
  { value: 'interrupt_status', label: 'Interrupt Status' },
  { value: 'manual_adjustment_count', label: 'Manual Adjusts' },
  { value: 'version', label: 'Version' },
  { value: 'entry_exit_event', label: 'Last Direction' },
  { value: 'sensor_status (text)', label: 'Sensor Status Text' },
  { value: 'enabled_features', label: 'Enabled Features' }
];

const features = [
  { value: 'vl53l1x.timeout', label: 'Timeout' },
  { value: 'vl53l1x.pins.interrupt', label: 'Interrupt Pin' },
  { value: 'vl53l1x.calibration.ranging', label: 'Ranging Mode' },
  { value: 'vl53l1x.calibration.offset', label: 'Distance Offset' },
  { value: 'vl53l1x.calibration.crosstalk', label: 'Crosstalk' },
  { value: 'roode.sampling', label: 'Sample Count' },
  { value: 'roode.orientation', label: 'Orientation' },
  { value: 'roode.roi', label: 'ROI Size' },
  { value: 'roode.detection_thresholds', label: 'Detection Thresholds' },
  { value: 'roode.calibration_persistence', label: 'Save Thresholds' },
  { value: 'roode.filter_mode & roode.filter_window', label: 'Filter Mode/Window' },
  { value: 'roode.log_fallback_events', label: 'Log Fallback Events' },
  { value: 'roode.force_single_core', label: 'Force Single Core' },
  { value: 'roode.invalid_distance_limit', label: 'Invalid Distance Limit' },
  { value: 'roode.restart_timeout', label: 'Restart Timeout' },
  { value: 'roode.zones.invert', label: 'Invert Zones' },
  { value: 'roode.zones.entry/exit', label: 'Per-zone Config' }
];

function populateSelect(el, items) {
  items.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item.value;
    opt.textContent = item.label;
    el.appendChild(opt);
  });
}

document.addEventListener('DOMContentLoaded', () => {
  const sensorSelect = document.getElementById('sensors');
  const featureSelect = document.getElementById('features');
  populateSelect(sensorSelect, sensors);
  populateSelect(featureSelect, features);

  const sensorChoices = new Choices(sensorSelect, { removeItemButton:true, searchEnabled:true, shouldSort:false });
  const featureChoices = new Choices(featureSelect, { removeItemButton:true, searchEnabled:true, shouldSort:false });

  function update() {
    const device = document.getElementById('device').value || 'roode';
    const ssid = document.getElementById('ssid').value || 'your_ssid';
    const wpass = document.getElementById('wpass').value || 'wifi_password';
    const apass = document.getElementById('apass').value || 'api_password';
    const otapass = document.getElementById('otapass').value || 'ota_password';
    const sensorVals = sensorChoices.getValue(true).join(', ');
    const featureVals = featureChoices.getValue(true).join(', ');
    const yaml = `substitutions:\n  devicename: ${device}\n  friendly_name: ${device}\n\nwifi:\n  ssid: "${ssid}"\n  password: "${wpass}"\n\napi:\n  password: "${apass}"\nota:\n  password: "${otapass}"\n\n# Sensors: ${sensorVals}\n# Features: ${featureVals}\n`;
    document.getElementById('configOutput').textContent = yaml;
  }

  ['device','ssid','wpass','apass','otapass'].forEach(id => {
    document.getElementById(id).addEventListener('input', update);
  });
  sensorSelect.addEventListener('change', update);
  featureSelect.addEventListener('change', update);

  document.getElementById('selectSensors').addEventListener('click', () => {
    sensors.forEach(s => sensorChoices.setChoiceByValue(s.value));
    update();
  });
  document.getElementById('clearSensors').addEventListener('click', () => {
    sensorChoices.removeActiveItems();
    update();
  });
  document.getElementById('selectFeatures').addEventListener('click', () => {
    features.forEach(f => featureChoices.setChoiceByValue(f.value));
    update();
  });
  document.getElementById('clearFeatures').addEventListener('click', () => {
    featureChoices.removeActiveItems();
    update();
  });

  document.getElementById('copyConfig').addEventListener('click', () => {
    navigator.clipboard.writeText(document.getElementById('configOutput').textContent);
  });

  update();
});
</script>
</body>
</html>
