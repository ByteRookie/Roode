<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Roode Configuration Helper</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
<style>
body { font-family: sans-serif; padding: 1rem; }
label { display: block; margin-top: 1rem; }
.copy-btn {
  border: none;
  background: none;
  cursor: pointer;
  font-size: 1rem;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
</head>
<body>
<h2>Roode Configuration Helper</h2>
<p>Select sensors and configuration options to copy into your YAML.</p>

<label>Sensors
<select id="sensors" multiple></select>
</label>

<label>Features
<select id="features" multiple></select>
</label>

<h3>Selected Sensors <button class="copy-btn" id="copySensors" title="Copy to clipboard">📋</button></h3>
<pre id="sensorList"></pre>

<h3>Selected Features <button class="copy-btn" id="copyFeatures" title="Copy to clipboard">📋</button></h3>
<pre id="featureList"></pre>

<script>
const sensors = [
 'people_counter',
 'presence_sensor',
 'sensor_xshut_state',
 'distance_entry',
 'distance_exit',
 'max_threshold_entry',
 'max_threshold_exit',
 'min_threshold_entry',
 'min_threshold_exit',
 'roi_height_entry',
 'roi_width_entry',
 'roi_height_exit',
 'roi_width_exit',
 'loop_time',
 'cpu_usage',
 'ram_free',
 'flash_free',
 'sensor_status',
 'interrupt_status',
 'manual_adjustment_count',
 'version',
 'entry_exit_event',
 'sensor_status (text)',
 'enabled_features'
];

const features = [
 'vl53l1x.sensor_id',
 'vl53l1x.address & vl53l1x.pins.xshut',
 'vl53l1x.timeout',
 'vl53l1x.pins.interrupt',
 'vl53l1x.calibration.ranging',
 'vl53l1x.calibration.offset',
 'vl53l1x.calibration.crosstalk',
 'roode.sampling',
 'roode.orientation',
 'roode.roi',
 'roode.detection_thresholds',
 'roode.calibration_persistence',
 'roode.filter_mode & roode.filter_window',
 'roode.log_fallback_events',
 'roode.force_single_core',
 'roode.invalid_distance_limit',
 'roode.restart_timeout',
 'roode.zones.invert',
 'roode.zones.entry/exit'
];

function populateSelect(selectEl, values) {
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    selectEl.appendChild(opt);
  });
}

document.addEventListener('DOMContentLoaded', () => {
  const sensorSelect = document.getElementById('sensors');
  const featureSelect = document.getElementById('features');
  populateSelect(sensorSelect, sensors);
  populateSelect(featureSelect, features);

  const sensorChoices = new Choices(sensorSelect, { removeItemButton: true });
  const featureChoices = new Choices(featureSelect, { removeItemButton: true });

  function update() {
    const sensorVals = sensorChoices.getValue(true);
    const featureVals = featureChoices.getValue(true);
    document.getElementById('sensorList').textContent = sensorVals.join(', ');
    document.getElementById('featureList').textContent = featureVals.join(', ');
  }

  sensorSelect.addEventListener('change', update);
  featureSelect.addEventListener('change', update);

  document.getElementById('copySensors').addEventListener('click', () => {
    navigator.clipboard.writeText(document.getElementById('sensorList').textContent);
  });

  document.getElementById('copyFeatures').addEventListener('click', () => {
    navigator.clipboard.writeText(document.getElementById('featureList').textContent);
  });
});
</script>

</body>
</html>
