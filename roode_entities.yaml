# ─────────────────────────────────────────────────────────────────────────────
# Roode HA Entities Package
# Include this file via packages in your main YAML:
#
#   packages:
#     roode_entities:
#       url: https://github.com/ByteRookie/Roode
#       ref: 1.8.0-Dev
#       files: [roode_entities.yaml]
#
# Override substitutions in your main YAML if needed:
#   friendly_name — label prefix for all entities   (default: "Roode")
#   roode_id      — must match `id:` in your roode: block (default: roode_platform)
#
# ── What you see in HA by default ────────────────────────────────────────────
#
#   Sensors
#     • Presence (binary)   • Last Direction   • Status
#
#   Configuration
#     • Calibrate (select — pick mode, runs immediately)
#     • Auto Calibration Interval
#     • Performance Mode     • Restart
#
#   Everything else is hidden (disabled_by_default: true).
#   To unhide: HA → Settings → Devices → [device] → tap entity count link.
#
# ─────────────────────────────────────────────────────────────────────────────
substitutions:
  friendly_name: Roode
  roode_id: roode_platform

# ── Primary sensors ───────────────────────────────────────────────────────────

binary_sensor:
  - platform: roode
    roode_id: ${roode_id}
    presence:
      name: $friendly_name Presence
      device_class: occupancy

text_sensor:
  - platform: roode
    roode_id: ${roode_id}
    entry_exit_event:
      name: $friendly_name Last Direction
    sensor_status:
      name: $friendly_name Status
    version:
      name: $friendly_name Version
      disabled_by_default: true
    enabled_features:
      name: $friendly_name Features
      disabled_by_default: true

# ── Configuration ─────────────────────────────────────────────────────────────

# Calibration: pick a mode from the dropdown → calibration runs immediately.
# No separate button needed. The selected option stays so you can see what
# was last run. Change it to run a different mode at any time.
select:
  - platform: template
    name: $friendly_name Calibrate
    id: calibration_trigger_select
    entity_category: config
    icon: mdi:tune
    options:
      - "Empty Room"
      - "With Person"
      - "Low Obstacle"
      - "High Obstacle"
    initial_option: "Empty Room"
    optimistic: true
    set_action:
      - lambda: |-
          if (x == "Empty Room")         id(${roode_id})->recalibration();
          else if (x == "With Person")   id(${roode_id})->person_calibration();
          else if (x == "Low Obstacle")  id(${roode_id})->calibrate_low_obstacle();
          else if (x == "High Obstacle") id(${roode_id})->calibrate_high_obstacle();

  - platform: roode
    roode_id: ${roode_id}
    filter_mode:
      name: $friendly_name Filter Mode
      entity_category: config
      disabled_by_default: true
    ranging_mode:
      name: $friendly_name Ranging Mode
      entity_category: config
      disabled_by_default: true
    orientation:
      name: $friendly_name Orientation
      entity_category: config
      disabled_by_default: true
      icon: mdi:rotate-3d-variant

number:
  - platform: roode
    roode_id: ${roode_id}
    auto_calibration_interval:
      name: $friendly_name Auto Calibration Interval
      entity_category: config
    # ── Hidden by default — enable in HA to tune manually ──────────────────
    filter_window:
      name: $friendly_name Filter Window
      entity_category: config
      disabled_by_default: true
    sampling:
      name: $friendly_name Sampling
      entity_category: config
      disabled_by_default: true
    entry_max_threshold:
      name: $friendly_name Entry Max Threshold
      entity_category: config
      disabled_by_default: true
    entry_min_threshold:
      name: $friendly_name Entry Min Threshold
      entity_category: config
      disabled_by_default: true
    exit_max_threshold:
      name: $friendly_name Exit Max Threshold
      entity_category: config
      disabled_by_default: true
    exit_min_threshold:
      name: $friendly_name Exit Min Threshold
      entity_category: config
      disabled_by_default: true
    entry_roi_height:
      name: $friendly_name Entry ROI Height
      entity_category: config
      disabled_by_default: true
    entry_roi_width:
      name: $friendly_name Entry ROI Width
      entity_category: config
      disabled_by_default: true
    exit_roi_height:
      name: $friendly_name Exit ROI Height
      entity_category: config
      disabled_by_default: true
    exit_roi_width:
      name: $friendly_name Exit ROI Width
      entity_category: config
      disabled_by_default: true

switch:
  - platform: roode
    roode_id: ${roode_id}
    performance_mode:
      name: $friendly_name Performance Mode
      entity_category: config
    invert_direction:
      name: $friendly_name Invert Direction
      entity_category: config
      disabled_by_default: true
    calibration_persistence:
      name: $friendly_name Save Calibration to Flash
      entity_category: config
      disabled_by_default: true

button:
  - platform: template
    name: $friendly_name Run Calibration
    entity_category: config
    icon: mdi:play-circle
    on_press:
      - lambda: |-
          std::string mode = id(calibration_trigger_select).state;
          if (mode == "With Person")        id(${roode_id})->person_calibration();
          else if (mode == "Low Obstacle")  id(${roode_id})->calibrate_low_obstacle();
          else if (mode == "High Obstacle") id(${roode_id})->calibrate_high_obstacle();
          else                              id(${roode_id})->recalibration();
  - platform: restart
    name: $friendly_name Restart
    entity_category: config

# ── Diagnostic sensors (all hidden by default) ────────────────────────────────

sensor:
  - platform: roode
    roode_id: ${roode_id}
    distance_entry:
      name: $friendly_name Distance Zone 0
      disabled_by_default: true
      filters:
        - delta: 100
    distance_exit:
      name: $friendly_name Distance Zone 1
      disabled_by_default: true
      filters:
        - delta: 100
    max_threshold_entry:
      name: $friendly_name Max Zone 0
      disabled_by_default: true
    max_threshold_exit:
      name: $friendly_name Max Zone 1
      disabled_by_default: true
    min_threshold_entry:
      name: $friendly_name Min Zone 0
      disabled_by_default: true
    min_threshold_exit:
      name: $friendly_name Min Zone 1
      disabled_by_default: true
    roi_height_entry:
      name: $friendly_name ROI Height Zone 0
      disabled_by_default: true
    roi_width_entry:
      name: $friendly_name ROI Width Zone 0
      disabled_by_default: true
    roi_height_exit:
      name: $friendly_name ROI Height Zone 1
      disabled_by_default: true
    roi_width_exit:
      name: $friendly_name ROI Width Zone 1
      disabled_by_default: true
    sensor_status:
      name: $friendly_name Sensor Status Code
      disabled_by_default: true
    manual_adjustment_count:
      name: $friendly_name Manual Adjustments
      disabled_by_default: true
    loop_time:
      name: $friendly_name Loop Time
      disabled_by_default: true
    cpu_usage:
      name: $friendly_name CPU Usage
      disabled_by_default: true
    ram_free:
      name: $friendly_name RAM Free
      disabled_by_default: true
    flash_free:
      name: $friendly_name Flash Used
      disabled_by_default: true
